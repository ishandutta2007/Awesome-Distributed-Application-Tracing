<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="grid-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".1"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".1"/></linearGradient><linearGradient id="text-gradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.4}50%{opacity:.9}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#text-gradient)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.trace-node{animation:pulse 3s infinite ease-in-out}.pulse-line{stroke-dasharray:8 8;animation:dash 20s linear infinite}</style><rect width="1200" height="400" fill="url(#bg-gradient)" rx="16"/><g opacity=".25"><path fill="none" stroke="#3b82f6" stroke-width="2" d="M 0 100 Q 300 50 600 100 T 1200 100" class="pulse-line"/><path fill="none" stroke="#8b5cf6" stroke-width="2" d="M 0 200 Q 300 280 600 200 T 1200 200" class="pulse-line"/><path fill="none" stroke="#ec4899" stroke-width="2" d="M 0 300 Q 300 250 600 300 T 1200 300" class="pulse-line"/><g class="trace-node"><circle cx="150" cy="100" r="6" fill="#60a5fa"/><circle cx="450" cy="230" r="8" fill="#a855f7"/><circle cx="850" cy="12