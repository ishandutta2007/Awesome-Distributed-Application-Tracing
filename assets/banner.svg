<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-gradient); }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .trace-node { animation: pulse 3s infinite ease-in-out; }
    .pulse-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-gradient)" rx="16" />

  <!-- Animated Dynamic Background Grid & Tracing Paths (Underneath Text) -->
  <g opacity="0.25">
    <path d="M 0 100 Q 300 50 600 100 T 1200 100" fill="none" stroke="#3b82f6" stroke-width="2" class="pulse-line" />
    <path d="M 0 200 Q 300 280 600 200 T 1200 200" fill="none" stroke="#8b5cf6" stroke-width="2" class="pulse-line" />
    <path d="M 0 300 Q 300 250 600 300 T 1200 300" fill="none" stroke="#ec4899" stroke-width="2" class="pulse-line" />

    <!-- Animated Trace Spans Background Visuals -->
    <g class="trace-node">
      <circle cx="150" cy="100" r="6" fill="#60a5fa" />
      <circle cx="450" cy="230" r="8" fill="#a855f7" />
      <circle cx="850" cy="120" r="7" fill="#ec4899" />
      <circle cx="1050" cy="280" r="6" fill="#3b82f6" />
      <line x1="150" y1="100" x2="450" y2="230" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="450" y1="230" x2="850" y2="120" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="850" y1="120" x2="1050" y2="280" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="4 4" />
    </g>
  </g>

  <!-- Decorative Border -->
  <rect x="2" y="2" width="1196" height="396" fill="none" stroke="url(#text-gradient)" stroke-width="2" rx="15" opacity="0.3" />

  <!-- FOREGROUND LAYER: Title, Subtitle, Badges (Always Sharp & Unobscured) -->
  <g text-anchor="middle">
    <!-- Icon/Logo Placeholder Circle -->
    <circle cx="600" cy="95" r="36" fill="#1e293b" stroke="#60a5fa" stroke-width="3" filter="url(#glow)" />
    <text x="600" y="107" font-size="34" text-anchor="middle">🔍</text>

    <!-- Main Title & Subtitle -->
    <text x="600" y="180" class="title" filter="url(#glow)">Awesome Distributed Application Tracing</text>
    <text x="600" y="222" class="subtitle">The Definitive Directory of Observability, OpenTelemetry &amp; Distributed Tracing Ecosystems</text>

    <!-- Pill Badges in Foreground -->
    <g transform="translate(600, 275)">
      <!-- Badge 1: OpenTelemetry Native -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
        <text x="75" y="20" class="badge-text" text-anchor="middle">🔭 OpenTelemetry</text>
      </g>
      <!-- Badge 2: Distributed Tracing -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
        <text x="80" y="20" class="badge-text" text-anchor="middle">⚡ High-Cardinality</text>
      </g>
      <!-- Badge 3: APM & Observability -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
        <text x="75" y="20" class="badge-text" text-anchor="middle">📊 APM &amp; Analytics</text>
      </g>
    </g>

    <!-- Footer Stats / Meta -->
    <text x="600" y="345" fill="#64748b" font-family="sans-serif" font-size="13">Updated October 2026 • Curated for SREs, DevOps &amp; Platform Engineers</text>
  </g>
</svg>
